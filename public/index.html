<!DOCTYPE html>
<html lang="es">
  <head>
      <link rel="icon" href="images/Logo.png" type="image/x-icon">
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Musicfy - PWA</title>

    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/styles.css" />

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1db954" />
  </head>
  <body>
    <!-- SPLASH -->
    <div id="splash" class="splash">
      <img src="/images/logo.png" alt="Musicfy" class="splash-logo" />
      <div class="loader">Cargando...</div>
    </div>

    <!-- APP -->
    <div id="app" class="hidden fade-in">
      <header class="cba-header">
        <img src="/images/logo.png" alt="logo" class="cba-header__logo" />
        <h1 class="cba-header__title">Musicfy</h1>
        <div class="actions">
          <button id="btn-voice">🎙️ Voz</button>
          <button id="btn-location">📍 Local</button>
          <button id="btn-notify">🔔 Notif</button>
        </div>
      </header>

      <main class="container">
        <section class="hero">
          <h2>Playlists recomendadas</h2>
          <div id="playlists" class="playlists"></div>
        </section>

        <section class="favorites">
          <h3>Favoritos</h3>
          <ul id="favoritesList"></ul>
        </section>
      </main>
    </div>

    <!-- JS -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
